<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc4ff"/><stop offset="100%" stop-color="#3d9bff"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eb8ff"/><stop offset="100%" stop-color="#4cd964"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee090"/><stop offset="100%" stop-color="#3ab856"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg4)"/>
  <g filter="url(#shadow4)">
    <!-- Bottom layer (green) -->
    <rect x="136" y="336" width="200" height="60" rx="12" fill="url(#layer3)"/>
    <!-- Middle layer (blue-green) -->
    <rect x="148" y="276" width="200" height="60" rx="12" fill="url(#layer2)"/>
    <!-- Top layer (blue) -->
    <rect x="160" y="216" width="200" height="60" rx="12" fill="url(#layer1)"/>
    <!-- File lines on top layer -->
    <rect x="180" y="232" width="60" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
    <rect x="180" y="244" width="100" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="180" y="256" width="80" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>
  </g>
</svg>
