<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CutX — 文件切割与合并工具</title>
<style>
:root {
  --bg: #1e1e1e;
  --panel: #252526;
  --card: #2d2d30;
  --hover: #323234;
  --border: #3e3e42;
  --accent: #4ec9b0;
  --text: #e0e0e0;
  --text2: #9e9e9e;
  --muted: #6e6e6e;
  --success: #4ec9b0;
  --warning: #dcdcaa;
  --error: #f44747;
  --info: #569cd6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; height: 100vh;
}
header {
  background: var(--panel); padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); display: flex;
  align-items: center; justify-content: center;
  color: var(--bg); font-weight: 700; font-size: 16px;
}
header h1 { font-size: 18px; font-weight: 600; }
header .ver { font-size: 12px; color: var(--muted); margin-left: auto; }
nav {
  display: flex; gap: 2px; padding: 0 24px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
nav button {
  background: none; border: none; color: var(--text2);
  padding: 10px 20px; cursor: pointer; font-size: 14px;
  border-bottom: 2px solid transparent; transition: all .15s;
  font-family: inherit;
}
nav button:hover { color: var(--text); background: var(--hover); }
nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
main { flex: 1; overflow-y: auto; padding: 24px; }
.page { display: none; }
.page.active { display: block; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 20px; margin-bottom: 16px;
}
.card h2 { font-size: 16px; margin-bottom: 16px; }
label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
input, select {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px; color: var(--text);
  font-size: 14px; width: 100%; font-family: inherit;
}
input:focus { border-color: var(--accent); outline: none; }
input[type=file] { display: none; }
.drop-zone {
  border: 2px dashed var(--border); border-radius: 8px;
  padding: 40px; text-align: center; cursor: pointer;
  transition: all .2s; background: #1f1f22;
}
.drop-zone:hover, .drop-zone.over { border-color: var(--accent); background: rgba(78,201,176,.05); }
.drop-zone .icon { font-size: 32px; margin-bottom: 8px; }
.drop-zone p { color: var(--text2); font-size: 14px; }
.drop-zone .path { color: var(--accent); font-size: 12px; margin-top: 8px; word-break: break-all; }
.row { display: flex; gap: 12px; margin-bottom: 16px; }
.row > div { flex: 1; }
.btn {
  padding: 12px 24px; border-radius: 6px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .15s; font-family: inherit;
}
.btn-primary {
  background: var(--accent); color: var(--bg);
  width: 100%; padding: 14px; font-size: 15px;
}
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-sec {
  background: var(--card); color: var(--text2);
  border: 1px solid var(--border);
}
.btn-sec:hover { border-color: var(--accent); color: var(--text); }
.progress-bar {
  height: 6px; background: var(--bg); border-radius: 3px;
  overflow: hidden; margin: 8px 0;
}
.progress-fill {
  height: 100%; background: var(--accent);
  border-radius: 3px; transition: width .3s; width: 0%;
}
.progress-text { font-size: 12px; color: var(--text2); }
.log {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 12px; height: 200px;
  overflow-y: auto; font-family: 'Cascadia Mono', 'Consolas', monospace;
  font-size: 12px; line-height: 1.6;
}
.log-line { margin-bottom: 2px; }
.log-line .ts { color: var(--muted); }
.log-line .msg { color: var(--text2); }
.log-line.success .msg { color: var(--success); }
.log-line.error .msg { color: var(--error); }
.log-line.warning .msg { color: var(--warning); }
.log-line.info .msg { color: var(--info); }
footer {
  background: var(--panel); padding: 8px 24px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
footer .status { font-size: 12px; color: var(--text2); }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.checkbox { display: flex; align-items: center; gap: 8px; }
.checkbox input { width: auto; }
.preview { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">C</div>
  <h1>CutX</h1>
  <span class="ver" id="version"></span>
</header>

<nav>
  <button class="active" onclick="showPage('split')">切割</button>
  <button onclick="showPage('merge')">合并</button>
  <button onclick="showPage('verify')">校验</button>
</nav>

<main>
  <!-- Split Page -->
  <div class="page active" id="page-split">
    <div class="card">
      <h2>切割文件</h2>
      <div class="drop-zone" id="splitDrop" onclick="document.getElementById('splitFile').click()">
        <div class="icon">📂</div>
        <p>拖拽文件到此处，或点击选择</p>
        <div class="path" id="splitFilePath"></div>
      </div>
      <input type="file" id="splitFile" onchange="onFileSelected(event,'splitFilePath')">
      <div class="row" style="margin-top:16px">
        <div>
          <label>切割大小</label>
          <select id="chunkSize">
            <option value="2G" selected>2G</option>
            <option value="1G">1G</option>
            <option value="500M">500M</option>
            <option value="100M">100M</option>
          </select>
        </div>
        <div>
          <label>校验算法</label>
          <select id="hashAlgo">
            <option value="md5" selected>MD5 (快速)</option>
            <option value="sha256">SHA-256 (安全)</option>
          </select>
        </div>
      </div>
      <label>输出目录</label>
      <input type="text" id="splitOutput" placeholder="留空 = 自动创建 cutx-<文件名>/ 子目录">
      <div class="preview" id="splitPreview"></div>
    </div>
    <button class="btn btn-primary" id="splitBtn" onclick="doSplit()">▶ 开始切割</button>
  </div>

  <!-- Merge Page -->
  <div class="page" id="page-merge">
    <div class="card">
      <h2>合并文件</h2>
      <div class="drop-zone" id="mergeDrop" onclick="document.getElementById('mergeFile').click()">
        <div class="icon">📄</div>
        <p>拖拽 .manifest.json 文件到此处</p>
        <div class="path" id="mergeFilePath"></div>
      </div>
      <input type="file" id="mergeFile" accept=".json" onchange="onFileSelected(event,'mergeFilePath')">
      <div class="row" style="margin-top:16px">
        <div>
          <label>合并模式</label>
          <select id="mergeMode">
            <option value="quick" selected>quick (快速，不校验)</option>
            <option value="verify">verify (边合并边校验)</option>
          </select>
        </div>
        <div>
          <label>输出目录</label>
          <input type="text" id="mergeOutput" placeholder="留空 = 清单所在目录">
        </div>
      </div>
      <div class="checkbox" style="margin-top:12px">
        <input type="checkbox" id="mergeForce">
        <label for="mergeForce" style="margin:0">强制覆盖已存在的文件</label>
      </div>
    </div>
    <button class="btn btn-primary" id="mergeBtn" onclick="doMerge()">▶ 开始合并</button>
  </div>

  <!-- Verify Page -->
  <div class="page" id="page-verify">
    <div class="card">
      <h2>校验分片</h2>
      <div class="drop-zone" id="verifyDrop" onclick="document.getElementById('verifyFile').click()">
        <div class="icon">✓</div>
        <p>拖拽 .manifest.json 文件到此处</p>
        <div class="path" id="verifyFilePath"></div>
      </div>
      <input type="file" id="verifyFile" accept=".json" onchange="onFileSelected(event,'verifyFilePath')">
      <p class="hint">校验不执行合并，仅验证所有分片的完整性</p>
    </div>
    <button class="btn btn-primary" id="verifyBtn" onclick="doVerify()">▶ 开始校验</button>
  </div>
</main>

<footer>
  <div class="progress-bar" style="flex:1"><div class="progress-fill" id="progressFill"></div></div>
  <span class="status" id="progressText">就绪</span>
</footer>

<div style="background:var(--panel);padding:12px 24px;border-top:1px solid var(--border)">
  <div class="log" id="logArea"></div>
</div>

<script>
let version = '';
let selectedFiles = {split:'', merge:'', verify:''};

async function api(path, opts) {
  const r = await fetch('/api'+path, opts);
  return r.json();
}

async function init() {
  const d = await api('/version');
  version = d.version || '';
  document.getElementById('version').textContent = version;
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  [...document.querySelectorAll('nav button')].find(b=>b.textContent===({split:'切割',merge:'合并',verify:'校验'})[p]).classList.add('active');
}

function onFileSelected(e, labelId) {
  const f = e.target.files[0];
  if (!f) return;
  // Note: browsers only give the file name, not full path
  // The backend will need to handle this differently
  document.getElementById(labelId).textContent = f.name + ' (请在下方输入完整路径)';
  // Create a text input for the path
  const page = e.target.closest('.page') || e.target.closest('.card');
  const inputId = e.target.id === 'splitFile' ? 'splitFilePathInput' 
                : e.target.id === 'mergeFile' ? 'mergeFilePathInput'
                : 'verifyFilePathInput';
  let inp = document.getElementById(inputId);
  if (!inp) {
    inp = document.createElement('input');
    inp.id = inputId;
    inp.type = 'text';
    inp.placeholder = '请输入完整文件路径';
    inp.style.marginTop = '8px';
    e.target.parentNode.appendChild(inp);
  }
  selectedFiles[e.target.id.replace('File','')] = f.name;
  inp.oninput = function() {
    selectedFiles[e.target.id.replace('File','')] = this.value;
    updateSplitPreview();
  };
  inp.focus();
}

function updateSplitPreview() {
  const f = selectedFiles.split;
  if (!f) return;
  const out = document.getElementById('splitOutput').value;
  if (out) {
    document.getElementById('splitPreview').textContent = '输出到: ' + out;
  } else {
    const name = f.split(/[\\/]/).pop().replace(/\.[^.]+$/, '');
    const dir = f.split(/[\\/]/).slice(0,-1).join('/') || '.';
    document.getElementById('splitPreview').textContent = '将创建: ' + dir + '/cutx-' + name + '/';
  }
}

// Drag and drop
['splitDrop','mergeDrop','verifyDrop'].forEach(id=>{
  const el = document.getElementById(id);
  el.ondragover = e=>{e.preventDefault();el.classList.add('over');};
  el.ondragleave = ()=>el.classList.remove('over');
  el.ondrop = e=>{
    e.preventDefault(); el.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    const key = id.replace('Drop','');
    selectedFiles[key] = f.path || f.name;
    document.getElementById(key+'FilePath').textContent = selectedFiles[key];
    if (key==='split') updateSplitPreview();
  };
});

function addLog(msg, level) {
  const log = document.getElementById('logArea');
  const div = document.createElement('div');
  div.className = 'log-line ' + (level||'info');
  const ts = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  div.innerHTML = '<span class="ts">['+ts+']</span> <span class="msg">'+msg+'</span>';
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setProgress(pct, text) {
  document.getElementById('progressFill').style.width = pct+'%';
  if (text) document.getElementById('progressText').textContent = text;
}

function disableBtn(id, disabled) {
  document.getElementById(id).disabled = disabled;
}

async function doSplit() {
  const file = selectedFiles.split || document.getElementById('splitFilePathInput')?.value;
  if (!file) { addLog('✗ 请先选择源文件', 'error'); return; }
  disableBtn('splitBtn', true);
  setProgress(0, '切割中...');
  addLog('开始切割: ' + file, 'info');
  const d = await api('/split', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      source: file,
      size: document.getElementById('chunkSize').value,
      hash: document.getElementById('hashAlgo').value,
      output: document.getElementById('splitOutput').value
    })
  });
  if (d.error) { addLog('✗ '+d.error, 'error'); setProgress(0,'失败'); }
  else { addLog('✓ 切割完成!', 'success'); setProgress(100,'完成'); }
  disableBtn('splitBtn', false);
}

async function doMerge() {
  const file = selectedFiles.merge || document.getElementById('mergeFilePathInput')?.value;
  if (!file) { addLog('✗ 请先选择清单文件', 'error'); return; }
  disableBtn('mergeBtn', true);
  setProgress(0, '合并中...');
  addLog('开始合并: ' + file, 'info');
  const d = await api('/merge', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      manifest: file,
      mode: document.getElementById('mergeMode').value,
      output: document.getElementById('mergeOutput').value,
      force: document.getElementById('mergeForce').checked
    })
  });
  if (d.error) { addLog('✗ '+d.error, 'error'); setProgress(0,'失败'); }
  else { addLog('✓ 合并完成!', 'success'); setProgress(100,'完成'); }
  disableBtn('mergeBtn', false);
}

async function doVerify() {
  const file = selectedFiles.verify || document.getElementById('verifyFilePathInput')?.value;
  if (!file) { addLog('✗ 请先选择清单文件', 'error'); return; }
  disableBtn('verifyBtn', true);
  setProgress(0, '校验中...');
  addLog('开始校验: ' + file, 'info');
  const d = await api('/verify', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ manifest: file })
  });
  if (d.error) { addLog('✗ '+d.error, 'error'); setProgress(0,'失败'); }
  else { addLog('✓ 校验通过!', 'success'); setProgress(100,'完成'); }
  disableBtn('verifyBtn', false);
}

init();
</script>
</body>
</html>
