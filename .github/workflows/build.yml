name: Build CutX

on:
  push:
    branches: [ master, main ]

jobs:
  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin,  goarch: amd64, output: cutx-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, output: cutx-darwin-arm64 }
          - { goos: linux,   goarch: amd64, output: cutx-linux-amd64 }
          - { goos: linux,   goarch: arm64, output: cutx-linux-arm64 }
          - { goos: windows, goarch: amd64, output: cutx-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
          go build -ldflags "-s -w" -o dist/${{ matrix.target.output }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.output }}
          path: dist/${{ matrix.target.output }}

  build-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build CutX.GUI with manual XamlCompiler capture
        shell: pwsh
        run: |
          cd winui
          # First do a restore to get NuGet packages
          dotnet restore CutX.GUI.csproj -p:EnableWindowsTargeting=true -p:Platform=x64
          
          # Now build — capture everything
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "dotnet"
          $psi.Arguments = "build CutX.GUI -c Release -p:EnableWindowsTargeting=true -p:Platform=x64 -v:detailed"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
          $psi.StandardErrorEncoding = [System.Text.Encoding]::UTF8
          
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $psi
          
          $stdoutBuilder = New-Object System.Text.StringBuilder
          $stderrBuilder = New-Object System.Text.StringBuilder
          
          $stdoutAction = {
            if (-not $EventArgs.Data) { return }
            Write-Host $EventArgs.Data
            [void]$stdoutBuilder.Append($EventArgs.Data + "`n")
          }
          $stderrAction = {
            if (-not $EventArgs.Data) { return }
            Write-Host "[STDERR] $EventArgs.Data"
            [void]$stderrBuilder.Append($EventArgs.Data + "`n")
          }
          
          $stdoutEvent = Register-ObjectEvent -InputObject $proc -EventName "OutputDataReceived" -Action $stdoutAction
          $stderrEvent = Register-ObjectEvent -InputObject $proc -EventName "ErrorDataReceived" -Action $stderrAction
          
          $proc.Start() | Out-Null
          $proc.BeginOutputReadLine()
          $proc.BeginErrorReadLine()
          $proc.WaitForExit()
          
          Write-Host "`n=== EXIT CODE: $($proc.ExitCode) ==="
          
          # Save full logs
          $stdoutBuilder.ToString() | Out-File -FilePath ../stdout.txt -Encoding utf8
          $stderrBuilder.ToString() | Out-File -FilePath ../stderr.txt -Encoding utf8
          
          Unregister-Event -SourceIdentifier $stdoutEvent.Name
          Unregister-Event -SourceIdentifier $stderrEvent.Name
          
          exit $proc.ExitCode
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            stdout.txt
            stderr.txt
            winui/CutX.GUI/obj/
      - name: Upload GUI exe on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CutX.GUI-windows-x64
          path: winui/CutX.GUI/bin/Release/*/win-x64/CutX.GUI.exe
