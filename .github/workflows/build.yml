name: Build CutX

on:
  push:
    branches: [ master, main ]

jobs:
  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin,  goarch: amd64, output: cutx-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, output: cutx-darwin-arm64 }
          - { goos: linux,   goarch: amd64, output: cutx-linux-amd64 }
          - { goos: linux,   goarch: arm64, output: cutx-linux-arm64 }
          - { goos: windows, goarch: amd64, output: cutx-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
          go build -ldflags "-s -w" -o dist/${{ matrix.target.output }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.output }}
          path: dist/${{ matrix.target.output }}

  build-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install WinApp CLI
        run: dotnet tool install --global winapp
      - name: Create fresh WinUI project from template
        run: |
          cd winui
          # Create a new project from the official template
          winapp new --name CutX.GUI.New --template winui-mvvm --use-defaults
          # Copy our source files into the new project
          Copy-Item -Force CutX.GUI/Themes/DarkTheme.xaml CutX.GUI.New/Themes/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force CutX.GUI.New/Themes
          Copy-Item -Force CutX.GUI/Themes/DarkTheme.xaml CutX.GUI.New/Themes/
          Copy-Item -Force CutX.GUI/MainWindow.xaml CutX.GUI.New/
          Copy-Item -Force CutX.GUI/MainWindow.xaml.cs CutX.GUI.New/
          New-Item -ItemType Directory -Force CutX.GUI.New/Views
          Copy-Item -Force CutX.GUI/Views/*.xaml CutX.GUI.New/Views/
          Copy-Item -Force CutX.GUI/Views/*.xaml.cs CutX.GUI.New/Views/
          New-Item -ItemType Directory -Force CutX.GUI.New/Models
          Copy-Item -Force CutX.GUI/Models/*.cs CutX.GUI.New/Models/
          New-Item -ItemType Directory -Force CutX.GUI.New/Services
          Copy-Item -Force CutX.GUI/Services/*.cs CutX.GUI.New/Services/
          Copy-Item -Force CutX.GUI/App.xaml CutX.GUI.New/ -ErrorAction SilentlyContinue
          Copy-Item -Force CutX.GUI/App.xaml.cs CutX.GUI.New/ -ErrorAction SilentlyContinue
      - name: Build with fresh template
        run: |
          cd winui/CutX.GUI.New
          dotnet build -c Release -p:Platform=x64
      - name: Upload GUI exe on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CutX.GUI-windows-x64
          path: winui/CutX.GUI.New/bin/Release/*/win-x64/CutX.GUI.New.exe
      - name: Upload obj on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-obj
          path: winui/CutX.GUI.New/obj/
