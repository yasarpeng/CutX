name: Build CutX

on:
  push:
    branches: [ master, main ]

jobs:
  # CLI builds (macOS + Linux, cross-compile, no CGO)
  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin,  goarch: amd64, output: cutx-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, output: cutx-darwin-arm64 }
          - { goos: linux,   goarch: amd64, output: cutx-linux-amd64 }
          - { goos: linux,   goarch: arm64, output: cutx-linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build ${{ matrix.target.output }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
          go build -ldflags "-s -w" -o dist/${{ matrix.target.output }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.output }}
          path: dist/${{ matrix.target.output }}

  # Windows GUI build (Wails + Vue3)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build frontend
        run: |
          cd gui/frontend
          npm install
          npm run build
      - name: Generate Wails bindings
        run: |
          cd gui
          wails generate module
      - name: Build Windows GUI
        run: |
          cd gui
          $env:CGO_ENABLED = "1"
          wails build -platform windows/amd64 -nsis false
      - uses: actions/upload-artifact@v4
        with:
          name: CutX-windows-amd64.exe
          path: gui/build/bin/CutX.exe
