name: Build CutX

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin,  goarch: amd64, output: cutx-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, output: cutx-darwin-arm64 }
          - { goos: linux,   goarch: amd64, output: cutx-linux-amd64 }
          - { goos: linux,   goarch: arm64, output: cutx-linux-arm64 }
          - { goos: windows, goarch: amd64, output: cutx-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build ${{ matrix.target.output }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
          go build -ldflags "-s -w -X 'github.com/pengyongshi/cutx/cmd.version=v1.0.0' -X 'github.com/pengyongshi/cutx/cmd.commit=${{ github.sha }}'" \
          -o dist/${{ matrix.target.output }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.output }}
          path: dist/${{ matrix.target.output }}

  build-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove .NET 10 SDK (force .NET 8)
        run: |
          $sdk10Dir = "C:\Program Files\dotnet\sdk\10.0.400"
          if (Test-Path $sdk10Dir) {
            Remove-Item -Recurse -Force $sdk10Dir
            Write-Host "Removed .NET 10 SDK"
          }
          dotnet --list-sdks
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify SDK version
        run: dotnet --list-sdks
      - name: Build CutX.GUI
        run: |
          cd winui
          dotnet build CutX.GUI -c Release -p:EnableWindowsTargeting=true -p:Platform=x64
      - name: Upload GUI exe on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CutX.GUI-windows-x64
          path: winui/CutX.GUI/bin/Release/*/win-x64/CutX.GUI.exe
      - name: Upload obj on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: winui/CutX.GUI/obj/
