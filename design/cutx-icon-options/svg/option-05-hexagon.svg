<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="hex5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc4ff"/>
      <stop offset="100%" stop-color="#3d9bff"/>
    </linearGradient>
    <filter id="shadow5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg5)"/>
  <g filter="url(#shadow5)" transform="translate(256 256)">
    <!-- Main hexagon -->
    <polygon points="0,-130 113,-65 113,65 0,130 -113,65 -113,-65" 
             fill="url(#hex5)" opacity="0.9"/>
    <!-- Fracture lines -->
    <g stroke="#4cd964" stroke-width="3" opacity="0.8" filter="url(#glow5)">
      <line x1="0" y1="-130" x2="0" y2="130"/>
      <line x1="0" y1="0" x2="113" y2="-65"/>
      <line x1="0" y1="0" x2="-113" y2="65"/>
    </g>
    <!-- Fragment offsets -->
    <polygon points="0,-130 113,-65 0,0 -113,-65" 
             fill="url(#hex5)" opacity="0.5" transform="translate(-12 -8)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="#4cd964" opacity="0.9"/>
  </g>
</svg>
