<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fc4ff"/>
      <stop offset="100%" stop-color="#3d9bff"/>
    </linearGradient>
    <linearGradient id="green2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ee07a"/>
      <stop offset="100%" stop-color="#3ab856"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg2)"/>
  <g filter="url(#shadow2)" transform="translate(256 256)">
    <!-- Left puzzle piece -->
    <path d="M -100 -100 L -20 -100 Q -20 -140 20 -140 Q 60 -140 60 -100 L 60 -20 Q 100 -20 100 20 L 100 100 L -100 100 Z" 
          fill="url(#blue2)" opacity="0.9"/>
    <!-- Right puzzle piece (offset, reassembling) -->
    <path d="M 100 -100 L 180 -100 L 180 100 L 100 100 L 100 20 Q 60 20 60 -20 L 60 -100 Q 100 -100 100 -100 Z" 
          fill="url(#green2)" opacity="0.9" transform="translate(40 20)"/>
    <!-- Connection dots -->
    <circle cx="0" cy="0" r="6" fill="#4cd964" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#7fffaa"/>
  </g>
</svg>
