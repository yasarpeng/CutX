<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="stroke8a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fc4ff"/><stop offset="100%" stop-color="#3d9bff"/>
    </linearGradient>
    <linearGradient id="stroke8b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee07a"/><stop offset="100%" stop-color="#3ab856"/>
    </linearGradient>
    <filter id="glow8">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg8)"/>
  <g filter="url(#shadow8)">
    <!-- Blue stroke: top-left to bottom-right -->
    <line x1="120" y1="120" x2="392" y2="392" stroke="url(#stroke8a)" stroke-width="34" stroke-linecap="round" filter="url(#glow8)"/>
    <!-- Arrowheads at both ends -->
    <polygon points="120,120 140,90 100,100" fill="url(#stroke8a)" filter="url(#glow8)"/>
    <polygon points="392,392 372,422 412,412" fill="url(#stroke8a)" filter="url(#glow8)"/>
    
    <!-- Green stroke: bottom-left to top-right -->
    <line x1="120" y1="392" x2="392" y2="120" stroke="url(#stroke8b)" stroke-width="34" stroke-linecap="round" filter="url(#glow8)"/>
    <!-- Arrowheads at both ends -->
    <polygon points="120,392 100,422 140,412" fill="url(#stroke8b)" filter="url(#glow8)"/>
    <polygon points="392,120 412,90 372,100" fill="url(#stroke8b)" filter="url(#glow8)"/>
    
    <!-- Center dot -->
    <circle cx="256" cy="256" r="14" fill="#0a0e14"/>
    <circle cx="256" cy="256" r="14" fill="none" stroke="#4cd964" stroke-width="3"/>
    <circle cx="256" cy="256" r="5" fill="#4cd964"/>
  </g>
</svg>
