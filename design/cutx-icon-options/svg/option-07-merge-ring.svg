<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="halfL7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fc4ff"/><stop offset="100%" stop-color="#3d9bff"/>
    </linearGradient>
    <linearGradient id="halfR7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ee07a"/><stop offset="100%" stop-color="#3ab856"/>
    </linearGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg7)"/>
  <g filter="url(#shadow7)">
    <!-- Left half (blue) - puzzle tab -->
    <path d="M 256 96 A 160 160 0 0 0 96 256 L 96 256 A 160 160 0 0 0 256 416 L 256 316 Q 296 316 296 256 Q 296 196 256 196 Z"
          fill="url(#halfL7)" opacity="0.9"/>
    <!-- Right half (green) - puzzle slot -->
    <path d="M 256 96 A 160 160 0 0 1 416 256 A 160 160 0 0 1 256 416 L 256 316 Q 296 316 296 256 Q 296 196 256 196 Z"
          fill="url(#halfR7)" opacity="0.9"/>
    <!-- Joint glow -->
    <line x1="256" y1="96" x2="256" y2="196" stroke="#4cd964" stroke-width="2" opacity="0.7" filter="url(#glow7)"/>
    <line x1="256" y1="316" x2="256" y2="416" stroke="#4cd964" stroke-width="2" opacity="0.7" filter="url(#glow7)"/>
  </g>
</svg>
