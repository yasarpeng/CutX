<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">
  <defs>
    <linearGradient id="csbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151c"/><stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="512" fill="url(#csbg)"/>
  
  <!-- Row 1: options 1-4 -->
  <!-- Option 1: Scissors -->
  <g transform="translate(8 8) scale(0.488)">
    <rect width="512" height="512" fill="#0a0e14" rx="12"/>
    <use href="#opt1"/>
  </g>
  <text x="128" y="264" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">01 Scissors</text>
  
  <!-- Option 2: Puzzle -->
  <g transform="translate(264 8) scale(0.488)">
    <rect width="512" height="512" fill="#0a0e14" rx="12"/>
  </g>
  <text x="384" y="264" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">02 Puzzle</text>
  
  <!-- Option 3: Split arrows -->
  <g transform="translate(520 8) scale(0.488)">
    <rect width="512" height="512" fill="#0a0e14" rx="12"/>
  </g>
  <text x="640" y="264" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">03 Arrows</text>
  
  <!-- Option 4: File stack -->
  <g transform="translate(776 8) scale(0.488)">
    <rect width="512" height="512" fill="#0a0e14" rx="12"/>
  </g>
  <text x="896" y="264" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">04 Stack</text>
  
  <!-- Row 2: options 5-8 -->
  <text x="128" y="488" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">05 Hexagon</text>
  <text x="384" y="488" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">06 Blade</text>
  <text x="640" y="488" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">07 Merge Ring</text>
  <text x="896" y="488" fill="#5b6472" font-size="16" font-family="sans-serif" text-anchor="middle">08 X-Split</text>
</svg>
