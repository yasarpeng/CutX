<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fc4ff"/>
      <stop offset="100%" stop-color="#3d9bff"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg1)"/>
  <!-- File block being cut -->
  <g filter="url(#shadow1)">
    <rect x="136" y="170" width="240" height="172" rx="14" fill="#1a2230" stroke="#2a3a4f" stroke-width="2"/>
    <rect x="160" y="200" width="120" height="6" rx="3" fill="#2d3d55"/>
    <rect x="160" y="218" width="160" height="6" rx="3" fill="#2d3d55"/>
    <rect x="160" y="236" width="100" height="6" rx="3" fill="#2d3d55"/>
  </g>
  <!-- Split line glow -->
  <line x1="136" y1="256" x2="376" y2="256" stroke="#4cd964" stroke-width="3" opacity="0.6"/>
  <line x1="136" y1="256" x2="376" y2="256" stroke="#4cd964" stroke-width="1.5" opacity="0.9"/>
  <!-- Scissors - two crossed blades -->
  <g filter="url(#shadow1)">
    <!-- Left blade -->
    <path d="M 256 256 L 156 136 L 148 144 L 248 264 Z" fill="url(#blue1)" opacity="0.95"/>
    <!-- Right blade -->
    <path d="M 256 256 L 356 136 L 364 144 L 264 264 Z" fill="url(#blue1)" opacity="0.85"/>
    <!-- Left handle ring -->
    <circle cx="136" cy="136" r="28" fill="none" stroke="url(#blue1)" stroke-width="10"/>
    <!-- Right handle ring -->
    <circle cx="376" cy="136" r="28" fill="none" stroke="url(#blue1)" stroke-width="10"/>
    <!-- Center pivot -->
    <circle cx="256" cy="256" r="8" fill="#1a2230" stroke="#4cd964" stroke-width="2"/>
  </g>
</svg>
